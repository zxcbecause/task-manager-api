# Activated with SPRING_PROFILES_ACTIVE=postgres (see docker-compose.yml).
# Connection settings come from environment variables; no secrets are stored in the repo.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasks}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  h2:
    console:
      enabled: false
